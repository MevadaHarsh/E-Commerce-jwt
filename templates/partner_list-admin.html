{% extends 'base-admin.html' %}
{% block content %}
{% load static %}

    <!-- ✅ MAIN CONTENT — everything lives inside here -->
    <div class="container-fluid py-4">

      <!-- ===== PENDING PARTNERS ===== -->
      <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
          <h3 class="fw-bold mb-1">Pending Partners</h3>
          <p class="text-muted mb-0">Accept or reject partner requests</p>
        </div>
        <button class="btn btn-dark" onclick="fetchPartners()">
          <i class="bi bi-arrow-clockwise me-1"></i>Refresh
        </button>
      </div>

      <div class="card border-0 shadow-sm mb-3">
        <div class="card-body">
          <div class="row g-2">
            <div class="col-md-6">
              <input type="text" id="searchInput" class="form-control" placeholder="Search partner..."
                oninput="filterPartners()">
            </div>
            <div class="col-md-6 text-end">
              <span id="partnerCount" class="text-muted small"></span>
            </div>
          </div>
        </div>
      </div>

      <div class="card border-0 shadow-sm mb-5">
        <div class="table-responsive">
          <table class="table table-hover align-middle mb-0">
            <thead class="table-dark">
              <tr>
                <th>#</th>
                <th>Name</th>
                <th>Email</th>
                <th>Phone</th>
                <th>Status</th>
                <th class="text-center">Actions</th>
              </tr>
            </thead>
            <tbody id="partnerTableBody"></tbody>
          </table>
        </div>
      </div>

      <!-- ===== DELIVERY PARTNERS ===== -->
      <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
          <h3 class="fw-bold mb-1">Delivery Partners</h3>
          <p class="text-muted mb-0">All registered delivery personnel</p>
        </div>
        <button class="btn btn-dark" onclick="fetchDeliveryPartners()">
          <i class="bi bi-arrow-clockwise me-1"></i>Refresh
        </button>
      </div>

      <div class="card border-0 shadow-sm mb-3">
        <div class="card-body">
          <div class="row g-2">
            <div class="col-md-6">
              <input type="text" id="dpSearchInput" class="form-control" placeholder="Search delivery partner..."
                oninput="filterDeliveryPartners()">
            </div>
            <div class="col-md-6 text-end">
              <span id="dpCount" class="text-muted small"></span>
            </div>
          </div>
        </div>
      </div>

      <div class="card border-0 shadow-sm mb-4">
        <div class="table-responsive">
          <table class="table table-hover align-middle mb-0">
            <thead class="table-dark">
              <tr>
                <th>#</th>
                <th>Username</th>
                <th>User ID</th>
                <th>Availability</th>
              </tr>
            </thead>
            <div class="d-flex gap-2 mt-3 mb-2 ms-2">
              <button id="prevBtn" class="btn btn-secondary" onclick="previousPageData()">
                Previous
              </button>

              <button id="nextBtn" class="btn btn-primary" onclick="nextPageData()">
                Next
              </button>
            </div>
            <tbody id="dpTableBody"></tbody>
          </table>
        </div>
      </div>

    </div>
    <!-- END MAIN CONTENT -->


    <!-- END d-flex wrapper -->

    <!-- VIEW MODAL -->
    <div class="modal fade" id="viewPartnerModal">
      <div class="modal-dialog modal-lg">
        <div class="modal-content border-0">
          <div class="modal-header bg-dark text-white">
            <h5 class="modal-title">Partner Details</h5>
            <button class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <div class="row g-3">
              <div class="col-md-6">
                <label class="form-label fw-semibold">Name</label>
                <div class="form-control bg-light" id="v_name"></div>
              </div>
              <div class="col-md-6">
                <label class="form-label fw-semibold">Email</label>
                <div class="form-control bg-light" id="v_email"></div>
              </div>
              <div class="col-md-6">
                <label class="form-label fw-semibold">Phone</label>
                <div class="form-control bg-light" id="v_phone"></div>
              </div>
              <div class="col-md-6">
                <label class="form-label fw-semibold">Status</label>
                <div class="form-control bg-light" id="v_status"></div>
              </div>
            </div>
          </div>
          <div class="modal-footer">
            <button class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
          </div>
        </div>
      </div>
    </div>


{% endblock content %}
