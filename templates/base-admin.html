{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TechZone Admin</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />

  <link href="{% static 'css/order-admin.css' %}" rel="stylesheet">
  <link href="{% static 'css/category-admin.css' %}" rel="stylesheet" />

</head>

<body>


  <nav class="navbar navbar-dark bg-dark px-3 py-2 sticky-top shadow-sm">
    <button class="btn btn-sm btn-outline-secondary me-3" id="sidebarToggle"><i class="bi bi-list fs-5"></i></button>
    <a class="navbar-brand fw-bold" href="#"><i class="bi bi-cpu-fill text-warning me-2"></i>TechZone <span
        class="text-warning">Admin</span></a>
    <div class="ms-auto d-flex align-items-center gap-3">
      <span class="badge bg-warning text-dark"><i class="bi bi-bell-fill me-1"></i>3</span>
      <div class="rounded-circle bg-warning text-dark d-flex align-items-center justify-content-center fw-bold"
        style="width:34px;height:34px;font-size:.8rem;">AD</div>
    </div>
  </nav>

    <div class="d-flex" style="min-height:calc(100vh - 56px);">
        <div class="bg-dark text-white d-flex flex-column flex-shrink-0" id="sidebar" style="width:240px;min-height:100%;transition:width .2s;">
            <div class="p-3 border-bottom border-secondary">
                <small class="text-secondary text-uppercase fw-semibold" style="letter-spacing:.08rem;font-size:.68rem;">Main Menu</small>
            </div>
            <ul class="nav flex-column p-2 gap-1">
                {% comment %} <li><a href="#" class="nav-link text-secondary rounded-2 px-3 py-2"><i
                    class="bi bi-speedometer2 me-2"></i><span class="sidebar-label">Dashboard</span></a></li> {% endcomment %}
                <li><a href="{% url 'category-admin' %}" class="nav-link text-secondary rounded-2 px-3 py-2"><i
                    class="bi bi-grid  me-2"></i><span class="sidebar-label">Categories</span></a></li>
                <li><a href="{% url 'product-admin' %}" class="nav-link text-secondary rounded-2 px-3 py-2"><i
                    class="bi bi-box-seam me-2"></i><span class="sidebar-label">Products</span></a></li>
                <li><a href="{% url 'order-page' %}" class="nav-link text-secondary rounded-2 px-3 py-2"><i
                    class="bi bi-box-seam  me-2"></i><span class="sidebar-label ">Order
                    History</span></a></li>
                <li class="nav-item"><a href="{% url 'partner_list' %}" class="nav-link text-secondary rounded-2 px-3 py-2"><i
                    class="bi bi-people-fill  me-2"></i><span class=" fw-semibold">Pending Partners</span></a></li>

            </ul>
            <div class="mt-auto p-2 border-top border-secondary">
                <a href="{% url 'login' %}" class="nav-link text-danger rounded-2 px-3 py-2"><i class="bi bi-box-arrow-left me-2"></i><span class="sidebar-label">Logout</span></a>
            </div>
        </div>




        {% block content %}
        {% endblock content %}


    




    </div>

    <script src="{% static 'js/order-admin.js' %}"></script>
    <script src="{% static 'js/category-admin.js' %}"></script>
    <script src="{% static 'js/product-admin.js' %}"></script>
    <script src="{% static 'js/partner_list-admin.js' %}"></script>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>


</body>

</html>
