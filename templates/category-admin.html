{% extends 'base-admin.html' %}
{% block content %}
{% load static %}


    <!-- MAIN -->
    <div class="flex-grow-1 p-4">

      <div class="d-flex justify-content-between align-items-center mb-4">

        <div>
          <h3 class="fw-bold mb-1">
            <i class="bi bi-grid-fill text-warning"></i>
            Category Management
          </h3>

          <p class="text-muted small mb-0">
            Manage your store categories
          </p>
        </div>

        <button class="btn btn-warning fw-semibold" data-bs-toggle="modal" data-bs-target="#addModal">
          <i class="bi bi-plus-lg"></i>
          Add Category
        </button>

      </div>

      <!-- ALERT -->
      <div id="global-alert" class="alert d-none"></div>

      <!-- SEARCH -->
      <div class="card shadow-sm mb-4">
        <div class="card-body">

          <div class="row g-2">

            <div class="col-md-6">
              <input type="text" id="searchInput" class="form-control" placeholder="Search category..."
                onkeyup="filterCategories()">
            </div>

            <div class="col-md-3">
              <select id="statusFilter" class="form-select" onchange="filterCategories()">

                <option value="">All Status</option>
                <option value="true">Active</option>
                <option value="false">Inactive</option>

              </select>
            </div>

            <div class="col-md-3 text-end">
              <button class="btn btn-dark" onclick="fetchCategories()">
                <i class="bi bi-arrow-clockwise"></i>
                Refresh
              </button>
            </div>

          </div>

        </div>
      </div>

      <!-- TABLE -->
      <div class="card shadow-sm">

        <div class="card-body p-0">

          <div class="table-responsive">

            <table class="table table-hover mb-0">

              <thead class="table-dark">

                <tr>
                  <th>ID</th>
                  <th>Name</th>
                  <th>Description</th>
                  <th>Status</th>
                  <th>Created</th>
                  <th class="text-center">Actions</th>
                </tr>

              </thead>

              <tbody id="categoryTable">

                <tr>
                  <td colspan="6" class="text-center py-5">

                    <div class="spinner-border text-warning"></div>

                  </td>
                </tr>

              </tbody>

            </table>

          </div>

        </div>

      </div>

    </div>
  </div>

  <!-- ADD MODAL -->
  <div class="modal fade" id="addModal">

    <div class="modal-dialog modal-dialog-centered">

      <div class="modal-content">

        <div class="modal-header bg-dark text-white">

          <h5 class="modal-title">
            Add Category
          </h5>

          <button class="btn-close btn-close-white" data-bs-dismiss="modal"></button>

        </div>

        <div class="modal-body">

          <div class="mb-3">

            <label class="form-label">
              Category Name
            </label>

            <input type="text" id="catName" class="form-control">

          </div>

          <div class="mb-3">

            <label class="form-label">
              Description
            </label>

            <textarea id="catDesc" class="form-control"></textarea>

          </div>

          <div class="mb-3">

            <label class="form-label">
              Status
            </label>

            <select id="catStatus" class="form-select">

              <option value="true">Active</option>
              <option value="false">Inactive</option>

            </select>

          </div>

        </div>

        <div class="modal-footer">

          <button class="btn btn-secondary" data-bs-dismiss="modal">
            Cancel
          </button>

          <button class="btn btn-warning" onclick="addCategory()">

            Add Category

          </button>

        </div>

      </div>

    </div>

  </div>
{% endblock content %}
