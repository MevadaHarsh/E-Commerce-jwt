{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Category Products</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    />

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
        rel="stylesheet"
    />

    <link href="{% static 'css/category-user.css' %}" rel="stylesheet"></link>

</head>

<body>

    <!-- NAVBAR -->

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top shadow-sm">

        <div class="container">

            <a class="navbar-brand fw-bold" href="#">

                <i class="bi bi-cpu-fill text-warning me-2"></i>

                TechZone

            </a>

            <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarNav"
            >

                <span class="navbar-toggler-icon"></span>

            </button>

            <div class="collapse navbar-collapse" id="navbarNav">

                <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-3">

                    <li class="nav-item">

                        <a class="nav-link" href="{% url 'dashboard' %}">
                            Home
                        </a>

                    </li>

                    <li class="nav-item">

                        <a class="nav-link active" href="/category-user/">
                            Categories
                        </a>

                    </li>

                    <!-- CART -->

                    <li class="nav-item position-relative">
                    <a href="{% url 'cart' %}" class="btn btn-outline-light position-relative">
                        <i class="bi bi-cart3"></i>
                        {% comment %} <span class="badge bg-danger rounded-pill cart-badge" id="cartCount">0</span> {% endcomment %}
                    </a>
                    </li>

                </ul>

            </div>

        </div>

    </nav>


    <!-- HEADER -->

    <section class="py-4 bg-white border-bottom">

        <div class="container">

            <div class="d-flex justify-content-between align-items-center flex-wrap gap-3">

                <div>

                    <h2 class="fw-bold mb-1" id="categoryTitle">
                        Products
                    </h2>

                    <p class="text-muted mb-0">
                        Browse products by category
                    </p>

                </div>

                <!-- CATEGORY DROPDOWN -->

                <select class="form-select w-auto" id="categorySelect">

                    <option value="">
                        All Categories
                    </option>

                </select>

            </div>

        </div>

    </section>


    <!-- PRODUCTS -->

    <section class="py-5" id="products">

        <div class="container">

            <div class="d-flex justify-content-between mb-4">

                <input
                    type="text"
                    id="searchInput"
                    class="form-control w-auto"
                    placeholder="Search products..."
                    oninput="filterProducts()"
                />

            </div>

            <div class="row g-4" id="productContainer"></div>

        </div>

    </section>


    <!-- CART OFFCANVAS -->

    <div
        class="offcanvas offcanvas-end"
        tabindex="-1"
        id="cartCanvas"
    >

        <div class="offcanvas-header">

            <h5 class="offcanvas-title">
                My Cart
            </h5>

            <button
                type="button"
                class="btn-close"
                data-bs-dismiss="offcanvas"
            ></button>

        </div>

        <div class="offcanvas-body">

            <div id="cartItems"></div>

            <hr>

            <div class="d-flex justify-content-between">

                <h5>Subtotal</h5>

                <h5 id="subtotal">
                    ₹0
                </h5>

            </div>

        </div>

    </div>


    <script src="{% static 'js/category-user.js' %}" ></script>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
