{% extends 'base-admin.html' %}
{% block content %}
{% load static %}

    <!-- MAIN -->
    <div class="container-fluid py-4">

      <div class="d-flex justify-content-between align-items-center mb-4">
        <h3 class="fw-bold mb-0">Products</h3>

        <button class="btn btn-warning fw-semibold" data-bs-toggle="modal" data-bs-target="#addProductModal">
          <i class="bi bi-plus-lg me-1"></i> Add Product
        </button>
      </div>

      <!-- FILTER -->
      <div class="card border-0 shadow-sm mb-3">
        <div class="card-body">
          <div class="row g-2">

            <div class="col-md-6">
              <input type="text" id="prodSearch" class="form-control" placeholder="Search..."
                oninput="filterProducts()" />
            </div>

            <div class="col-md-3">
              <select id="prodCatFilter" class="form-select" onchange="filterProducts()">
                <option value="">All Categories</option>
              </select>
            </div>

            <div class="col-md-3 text-end">
              <span id="prodCount" class="text-muted small"></span>
            </div>

          </div>
        </div>
      </div>

      <!-- TABLE -->
      <div class="card border-0 shadow-sm">

        <div class="table-responsive">

          <table class="table table-hover align-middle mb-0">

            <thead class="table-dark">
              <tr>
                <th>#</th>
                <th>Name</th>
                <th>Category</th>
                <th>Price</th>
                <th>Stock</th>
                <th>Status</th>
                <th class="text-center">Actions</th>
              </tr>
            </thead>

            <tbody id="prodTableBody"></tbody>

          </table>

        </div>

      </div>

    </div>


    <!-- ADD MODAL -->
    <div class="modal fade" id="addProductModal">
      <div class="modal-dialog">
        <div class="modal-content">

          <div class="modal-header bg-dark text-white">
            <h5 class="modal-title">Add Product</h5>
            <button class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
          </div>

          <div class="modal-body">

            <input class="form-control mb-2" id="newProdName" placeholder="Name">

            <select class="form-select mb-2" id="newProdCat"></select>

            <input type="number" class="form-control mb-2" id="newProdPrice" placeholder="Price">

            <input type="number" class="form-control mb-2" id="newProdStock" placeholder="Stock">

          </div>

          <div class="modal-footer">
            <button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
            <button class="btn btn-warning" onclick="addProduct()">Add</button>
          </div>

        </div>
      </div>

      <!-- EDIT MODAL -->
      <div class="modal fade" id="editProductModal">
        <div class="modal-dialog">
          <div class="modal-content">

            <div class="modal-header bg-dark text-white">
              <h5>Edit Product</h5>
              <button class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>

            <div class="modal-body">

              <input type="hidden" id="editProdId">

              <input class="form-control mb-2" id="editProdName">
              <select class="form-select mb-2" id="editProdCat"></select>
              <input class="form-control mb-2" id="editProdPrice">

              {% comment %} <!-- stock still available here (optional) -->
              <input class="form-control mb-2" id="editProdStock"> {% endcomment %}

            </div>

            <div class="modal-footer">
              <button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
              <button class="btn btn-warning" onclick="saveProductEdit()">Save</button>
            </div>

          </div>
        </div>
      </div>

      <!-- DELETE MODAL -->
      <div class="modal fade" id="deleteProdModal">
        <div class="modal-dialog modal-sm">
          <div class="modal-content">

            <div class="modal-body text-center p-4">
              <h5>Delete Product?</h5>

              <input type="hidden" id="deleteProdId">

              <button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
              <button class="btn btn-danger" onclick="confirmDeleteProd()">Delete</button>
            </div>

          </div>
        </div>
      </div>
    </div>
{% endblock content %}
