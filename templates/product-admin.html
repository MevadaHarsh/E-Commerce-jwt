<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>TechZone Admin – Products</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    rel="stylesheet"
  />
</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-dark px-3 py-2 sticky-top shadow-sm">
  <button class="btn btn-sm btn-outline-secondary me-3" id="sidebarToggle">
    <i class="bi bi-list fs-5"></i>
  </button>

  <a class="navbar-brand fw-bold" href="#">
    <i class="bi bi-cpu-fill text-warning me-2"></i>TechZone <span class="text-warning">Admin</span>
  </a>

  <div class="ms-auto d-flex align-items-center gap-3">
    <span class="badge bg-warning text-dark">
      <i class="bi bi-bell-fill me-1"></i>3
    </span>

    <div class="d-flex align-items-center gap-2">
      <div class="rounded-circle bg-warning text-dark d-flex align-items-center justify-content-center fw-bold"
           style="width:34px;height:34px;font-size:.8rem;">
        AD
      </div>
      <span class="text-white small d-none d-md-inline">Admin</span>
    </div>
  </div>
</nav>

<div class="d-flex" style="min-height:calc(100vh - 56px);">

  <!-- SIDEBAR -->
  <div class="bg-dark text-white d-flex flex-column flex-shrink-0"
       id="sidebar"
       style="width:240px;min-height:100%;">

    <div class="p-3 border-bottom border-secondary">
      <small class="text-secondary text-uppercase fw-semibold">Main Menu</small>
    </div>

    <ul class="nav flex-column p-2 gap-1">

      <li class="nav-item">
        <a href="{% url 'category-admin' %}" class="nav-link text-secondary px-3 py-2">
          <i class="bi bi-grid-fill me-2"></i>Categories
        </a>
      </li>

      <li class="nav-item">
        <a href="{% url 'product-admin' %}" class="nav-link text-white bg-warning bg-opacity-10 px-3 py-2">
          <i class="bi bi-box-seam text-warning me-2"></i>
          <span class="text-warning fw-semibold">Products</span>
        </a>
      </li>

      <li><a href="{% url 'order-page' %}" class="nav-link text-secondary rounded-2 px-3 py-2"><i class="bi bi-box-seam me-2"></i><span class="sidebar-label">Order History</span></a></li>
      {% comment %} <li><a href="{% url 'partner_list' %}" class="nav-link text-secondary rounded-2 px-3 py-2"><i class="bi bi-box-seam me-2"></i><span class="sidebar-label">partner list</span></a></li> {% endcomment %}
      <li class="nav-item"><a href="{% url 'partner_list' %}" class="nav-link text-secondary rounded-2 px-3 py-2"><i class="bi bi-people-fill  me-2"></i><span class=" fw-semibold">Pending Partners</span></a></li>

    </ul>

    <div class="mt-auto p-2 border-top border-secondary">
      <a href="{% url 'login' %}" class="nav-link text-danger px-3 py-2">
        <i class="bi bi-box-arrow-left me-2"></i>Logout
      </a>
    </div>

  </div>

  <!-- MAIN -->
  <div class="container-fluid py-4">

    <div class="d-flex justify-content-between align-items-center mb-4">
      <h3 class="fw-bold mb-0">Products</h3>

      <button class="btn btn-warning fw-semibold"
              data-bs-toggle="modal"
              data-bs-target="#addProductModal">
        <i class="bi bi-plus-lg me-1"></i> Add Product
      </button>
    </div>

    <!-- FILTER -->
    <div class="card border-0 shadow-sm mb-3">
      <div class="card-body">
        <div class="row g-2">

          <div class="col-md-6">
            <input type="text"
                   id="prodSearch"
                   class="form-control"
                   placeholder="Search..."
                   oninput="filterProducts()"/>
          </div>

          <div class="col-md-3">
            <select id="prodCatFilter"
                    class="form-select"
                    onchange="filterProducts()">
              <option value="">All Categories</option>
            </select>
          </div>

          <div class="col-md-3 text-end">
            <span id="prodCount" class="text-muted small"></span>
          </div>

        </div>
      </div>
    </div>

    <!-- TABLE -->
    <div class="card border-0 shadow-sm">

      <div class="table-responsive">

        <table class="table table-hover align-middle mb-0">

          <thead class="table-dark">
            <tr>
              <th>#</th>
              <th>Name</th>
              <th>Category</th>
              <th>Price</th>
              <th>Stock</th>
              <th>Status</th>
              <th class="text-center">Actions</th>
            </tr>
          </thead>

          <tbody id="prodTableBody"></tbody>

        </table>

      </div>

    </div>

  </div>
</div>

<!-- ADD MODAL -->
<div class="modal fade" id="addProductModal">
  <div class="modal-dialog">
    <div class="modal-content">

      <div class="modal-header bg-dark text-white">
        <h5 class="modal-title">Add Product</h5>
        <button class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>

      <div class="modal-body">

        <input class="form-control mb-2" id="newProdName" placeholder="Name">

        <select class="form-select mb-2" id="newProdCat"></select>

        <input type="number" class="form-control mb-2" id="newProdPrice" placeholder="Price">

        <input type="number" class="form-control mb-2" id="newProdStock" placeholder="Stock">

      </div>

      <div class="modal-footer">
        <button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button class="btn btn-warning" onclick="addProduct()">Add</button>
      </div>

    </div>
  </div>
</div>

<!-- EDIT MODAL -->
<div class="modal fade" id="editProductModal">
  <div class="modal-dialog">
    <div class="modal-content">

      <div class="modal-header bg-dark text-white">
        <h5>Edit Product</h5>
        <button class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>

      <div class="modal-body">

        <input type="hidden" id="editProdId">

        <input class="form-control mb-2" id="editProdName">
        <select class="form-select mb-2" id="editProdCat"></select>
        <input class="form-control mb-2" id="editProdPrice">

        {% comment %} <!-- stock still available here (optional) -->
        <input class="form-control mb-2" id="editProdStock"> {% endcomment %}

      </div>

      <div class="modal-footer">
        <button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button class="btn btn-warning" onclick="saveProductEdit()">Save</button>
      </div>

    </div>
  </div>
</div>

<!-- DELETE MODAL -->
<div class="modal fade" id="deleteProdModal">
  <div class="modal-dialog modal-sm">
    <div class="modal-content">

      <div class="modal-body text-center p-4">
        <h5>Delete Product?</h5>

        <input type="hidden" id="deleteProdId">

        <button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button class="btn btn-danger" onclick="confirmDeleteProd()">Delete</button>
      </div>

    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>

const API_PRODUCTS = '/api/product/';
const API_CATEGORY = '/api/category/';

let products = [];
let categories = [];

/* ---------- AUTH HEADER ---------- */
function apiHeaders() {
  return {
    'Content-Type': 'application/json',
    'Authorization': `Bearer ${localStorage.getItem('access')}`
  };
}

/* ---------- FETCH CATEGORIES ---------- */
async function fetchCategories() {

  const res = await fetch(API_CATEGORY, { headers: apiHeaders() });
  const data = await res.json();

  categories = Array.isArray(data) ? data : data.results;

  loadCategoryDropdowns();
}

/* ---------- LOAD DROPDOWNS ---------- */
function loadCategoryDropdowns() {

  const add = document.getElementById('newProdCat');
  const edit = document.getElementById('editProdCat');
  const filter = document.getElementById('prodCatFilter');

  add.innerHTML = '<option value="">Select</option>';
  edit.innerHTML = '';
  filter.innerHTML = '<option value="">All Categories</option>';

  categories.forEach(c => {

    add.innerHTML += `<option value="${c.id}">${c.name}</option>`;
    edit.innerHTML += `<option value="${c.id}">${c.name}</option>`;
    filter.innerHTML += `<option value="${c.id}">${c.name}</option>`;
  });
}

/* ---------- STOCK INLINE UPDATE ---------- */
async function updateStock(id, value) {

  const stock = Number(value); // ✔ FIX

  if (!Number.isFinite(stock)) return;

  const res = await fetch(API_PRODUCTS + id + '/', {
    method: 'PATCH',
    headers: apiHeaders(),
    body: JSON.stringify({ stock: value })
  });

  if (res.ok) {
    fetchProducts();
  } else {
    alert("Stock update failed");
  }
}

/* ---------- RENDER PRODUCTS ---------- */
function renderProducts(list) {

  document.getElementById('prodCount').innerText =
    `Showing ${list.length}`;

  const tbody = document.getElementById('prodTableBody');

  tbody.innerHTML = list.map((p, i) => `
    <tr>
      <td>${i + 1}</td>
      <td>${p.name}</td>
      <td>${getCategoryName(p.category)}</td>
      <td>₹${p.price}</td>

      <!-- INLINE STOCK -->
      <td>
        <input type="number"
               value="${p.stock}"
               class="form-control form-control-sm"
               style="width:90px"
               onchange="updateStock(${p.id}, this.value)">
      </td>

      <td>
        <span class="badge ${p.is_available ? 'bg-success' : 'bg-danger'}">
          ${p.is_available ? 'Active' : 'Inactive'}
        </span>
      </td>

      <td class="text-center">
        <button class="btn btn-sm btn-warning" onclick="openEditProd(${p.id})">
          <i class="bi bi-pencil"></i>
        </button>

        <button class="btn btn-sm btn-danger" onclick="openDeleteProd(${p.id})">
          <i class="bi bi-trash"></i>
        </button>
      </td>
    </tr>
  `).join('');
}

/* ---------- CATEGORY NAME ---------- */
function getCategoryName(id) {
  const c = categories.find(x => x.id == id);
  return c ? c.name : 'Unknown';
}

/* ---------- FETCH PRODUCTS ---------- */
async function fetchProducts() {

  const res = await fetch(API_PRODUCTS, { headers: apiHeaders() });
  products = await res.json();

  renderProducts(products);
}

/* ---------- OPEN EDIT ---------- */
function openEditProd(id) {

  const p = products.find(x => x.id === id);
  if (!p) return;

  document.getElementById('editProdId').value = p.id;
  document.getElementById('editProdName').value = p.name;
  document.getElementById('editProdCat').value = p.category;
  document.getElementById('editProdPrice').value = p.price;

  new bootstrap.Modal(
    document.getElementById('editProductModal')
  ).show();
}

/* ---------- SAVE EDIT ---------- */
async function saveProductEdit() {

  const id = document.getElementById('editProdId').value;

  const body = {
    name: document.getElementById('editProdName').value,
    category: document.getElementById('editProdCat').value,
    price: document.getElementById('editProdPrice').value,
  };

  const res = await fetch(API_PRODUCTS + id + '/', {
    method: 'PATCH',
    headers: apiHeaders(),
    body: JSON.stringify(body)
  });

  if (res.ok) {

    bootstrap.Modal.getInstance(
      document.getElementById('editProductModal')
    ).hide();

    fetchProducts();

  } else {
    alert("Update failed");
  }
}

/* ---------- DELETE ---------- */
function openDeleteProd(id) {
  document.getElementById('deleteProdId').value = id;

  new bootstrap.Modal(
    document.getElementById('deleteProdModal')
  ).show();
}

async function confirmDeleteProd() {

  const id = document.getElementById('deleteProdId').value;

  const res = await fetch(API_PRODUCTS + id + '/', {
    method: 'DELETE',
    headers: apiHeaders()
  });

  if (res.ok) {

    // close modal
    const modalEl = document.getElementById('deleteProdModal');
    const modal = bootstrap.Modal.getInstance(modalEl);
    modal.hide();

    fetchProducts();
  }
}

async function addProduct() {

  const body = {
    name: document.getElementById('newProdName').value,
    category: document.getElementById('newProdCat').value,
    price: document.getElementById('newProdPrice').value,
    stock: document.getElementById('newProdStock').value,
  };

  // basic validation
  if (!body.name || !body.category || !body.price || !body.stock) {
    alert("Please fill all fields");
    return;
  }

  const res = await fetch(API_PRODUCTS, {
    method: "POST",
    headers: apiHeaders(),
    body: JSON.stringify(body)
  });

  if (res.ok) {

    // close modal
    bootstrap.Modal.getInstance(
      document.getElementById('addProductModal')
    ).hide();

    // clear fields
    document.getElementById('newProdName').value = "";
    document.getElementById('newProdPrice').value = "";
    document.getElementById('newProdStock').value = "";
    document.getElementById('newProdCat').value = "";

    fetchProducts(); // refresh table

  } else {

    const err = await res.json();
    alert(err.message || "Add product failed ❌");
  }
}

/* ---------- INIT ---------- */
fetchCategories();
fetchProducts();

</script>

</body>
</html>
