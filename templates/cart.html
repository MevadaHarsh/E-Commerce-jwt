<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>TechZone Cart</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>

<style>
body { background:#f4f5f7; }

.cart-card, .summary-card {
  background:#fff;
  border-radius:12px;
  box-shadow:0 2px 10px rgba(0,0,0,.08);
}

.qty-box {
  display:flex;
  border:1px solid #ddd;
  border-radius:8px;
  overflow:hidden;
  width:fit-content;
}

.qty-btn {
  width:32px;
  background:#f2f2f2;
  border:none;
  font-weight:bold;
  cursor:pointer;
}

.qty-input {
  width:40px;
  border:none;
  text-align:center;
}
</style>
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top shadow-sm">

  <div class="container">

    <a class="navbar-brand fw-bold" href="#">
      <i class="bi bi-cpu-fill text-warning me-2"></i>
      TechZone
    </a>

    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarNav">

      <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-3">

        <li class="nav-item">
          <a class="nav-link" href="{% url 'dashboard' %}">Home</a>
        </li>

        <li class="nav-item">
          <a class="nav-link" href="/category-user/">Categories</a>
        </li>

        <li class="nav-item position-relative">
          <a href="{% url 'cart' %}" class="btn btn-outline-light position-relative">
            <i class="bi bi-cart3"></i>
            {% comment %} <span class="badge bg-danger rounded-pill cart-badge" id="cartCount">0</span> {% endcomment %}
          </a>
        </li>

      </ul>

    </div>

  </div>
</nav>

<!-- CART -->
<div class="container mt-4">

<div class="row g-4">

  <!-- CART TABLE -->
  <div class="col-lg-8">
    <div class="cart-card p-3">

      <table class="table align-middle">
        <thead class="table-dark">
          <tr>
            <th>Product</th>
            <th>Price</th>
            <th>Qty</th>
            <th>Total</th>
            <th></th>
          </tr>
        </thead>

        <tbody id="cartBody"></tbody>

      </table>

    </div>
  </div>

  <!-- SUMMARY -->
  <div class="col-lg-4">
    <div class="summary-card p-3">

      <h5>Order Summary</h5>
      <hr>

      <div class="d-flex justify-content-between">
        <span>Subtotal</span>
        <b id="subtotal">₹0</b>
      </div>

      <div class="d-flex justify-content-between mt-2">
        <span>Total</span>
        <b id="total">₹0</b>
      </div>

    </div>

    <button id="checkoutBtn" class="mt-3 rounded-3 w-100 btn btn-warning fw-bold">Procced To Checkout</button>
    
  </div>


</div>
</div>

<script>

let cartItems = [];

function getToken() {
  return localStorage.getItem("access");
}

document.getElementById("checkoutBtn").addEventListener("click", async () => {

  const token = getToken();

  const res = await fetch('/api/cart/', {
    headers: {
      "Authorization": `Bearer ${token}`
    }
  });

  const data = await res.json();

  // Check cart is empty
  if (!data.cart_item || data.cart_item.length === 0) {
    alert("Your cart is empty");
    return;
  }

  // Go to checkout page
  window.location.href = "/checkout/";

});

function checkLogin() {
  const token = getToken();

  if (!token) {
    // Redirect to login page
    window.location.href = "/login/";
  }
}

// Run check when page loads
checkLogin();

/* LOAD CART */
async function loadCart() {

  const token = getToken();

  const res = await fetch('/api/cart/', {
    headers: {
      "Authorization": `Bearer ${token}`
    }
  });

  const data = await res.json();

  cartItems = data.cart_item || [];

  renderCart();
}

/* GET PRODUCT */
async function getProduct(id) {

  const token = getToken();

  const res = await fetch(`/api/product/${id}/`, {
    headers: {
      "Authorization": `Bearer ${token}`
    }
  });

  return await res.json();
}

/* INCREASE */
async function increaseQty(productId) {

  const token = getToken();

  const res = await fetch(`/api/increase/${productId}/`, {
    method: "POST",
    headers: {
      "Authorization": `Bearer ${token}`,
      "Content-Type": "application/json"
    }
  });

  const data = await res.json();

  const msgBox = document.getElementById(`msg-${productId}`);

  if (res.ok) {

    if (msgBox) msgBox.innerText = "";
    loadCart();

  } else {

    if (msgBox) msgBox.innerText = data.message || "Out of stock ❌";

    setTimeout(() => {
      if (msgBox) msgBox.innerText = "";
    }, 2500);
  }
}

/* DECREASE */
async function decreaseQty(productId) {

  const token = getToken();

  const res = await fetch(`/api/decrease/${productId}/`, {
    method: "POST",
    headers: {
      "Authorization": `Bearer ${token}`,
      "Content-Type": "application/json"
    }
  });

  const data = await res.json();

  if (res.ok) {
    loadCart();
  } else {
    alert(data.message || "Cannot decrease quantity");
  }
}

/* RENDER CART */
async function renderCart() {

  const container = document.getElementById("cartBody");
  container.innerHTML = "";

  let subtotal = 0;

  for (let item of cartItems) {

    const product = await getProduct(item.Product);
    if (!product) continue;

    const total = product.price * item.quantity;
    subtotal += total;

    container.innerHTML += `
      <tr>

        <td>
          <b>${product.name}</b><br>
          <small class="text-muted">ID: ${item.Product}</small>

          <!-- ITEM LEVEL MESSAGE -->
          <div id="msg-${item.Product}" class="text-danger small"></div>
        </td>

        <td>₹${product.price}</td>

        <td>
          <div class="qty-box">

            <button class="qty-btn"
              onclick="decreaseQty(${item.Product})">
              -
            </button>

            <input class="qty-input" value="${item.quantity}" readonly/>

            <button class="qty-btn"
              onclick="increaseQty(${item.Product})">
              +
            </button>

          </div>
        </td>

        <td>₹${total}</td>

        <td>
          <button class="btn btn-sm btn-danger">
            <i class="bi bi-trash"></i>
          </button>
        </td>

      </tr>
    `;
  }

  document.getElementById("subtotal").innerText = "₹" + subtotal;
  document.getElementById("total").innerText = "₹" + subtotal;
}



loadCart();

</script>

</body>
</html>
