{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>TechZone Cart</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>

<style src="{% static 'css/cart.css' %}" ></style>
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top shadow-sm">

  <div class="container">

    <a class="navbar-brand fw-bold" href="#">
      <i class="bi bi-cpu-fill text-warning me-2"></i>
      TechZone
    </a>

    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarNav">

      <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-3">

        <li class="nav-item">
          <a class="nav-link" href="{% url 'dashboard' %}">Home</a>
        </li>

        <li class="nav-item">
          <a class="nav-link" href="/category-user/">Categories</a>
        </li>

        <li class="nav-item position-relative">
          <a href="{% url 'cart' %}" class="btn btn-outline-light position-relative">
            <i class="bi bi-cart3"></i>
            {% comment %} <span class="badge bg-danger rounded-pill cart-badge" id="cartCount">0</span> {% endcomment %}
          </a>
        </li>

      </ul>

    </div>

  </div>
</nav>

<!-- CART -->
<div class="container mt-4">

<div class="row g-4">

  <!-- CART TABLE -->
  <div class="col-lg-8">
    <div class="cart-card p-3">

      <table class="table align-middle">
        <thead class="table-dark">
          <tr>
            <th>Product</th>
            <th>Price</th>
            <th>Qty</th>
            <th>Total</th>
            <th></th>
          </tr>
        </thead>

        <tbody id="cartBody"></tbody>

      </table>

    </div>
  </div>

  <!-- SUMMARY -->
  <div class="col-lg-4">
    <div class="summary-card p-3">

      <h5>Order Summary</h5>
      <hr>

      <div class="d-flex justify-content-between">
        <span>Subtotal</span>
        <b id="subtotal">₹0</b>
      </div>

      <div class="d-flex justify-content-between mt-2">
        <span>Total</span>
        <b id="total">₹0</b>
      </div>

    </div>

    <button id="checkoutBtn" class="mt-3 rounded-3 w-100 btn btn-warning fw-bold">Procced To Checkout</button>
    
  </div>


</div>
</div>

<script src="{% static 'js/cart.js' %}"></script>

</body>
</html>
