{% extends 'base-dashboard.html' %}
{% block content %}
{% load static %}

<!-- CART -->
<div class="container mt-4">

  <div class="row g-4">

    <!-- CART TABLE -->
    <div class="col-lg-8">
      <div class="cart-card p-3">

        <table class="table align-middle">
          <thead class="table-dark">
            <tr>
              <th>Product</th>
              <th>Price</th>
              <th>Qty</th>
              <th>Total</th>
              <th></th>
            </tr>
          </thead>

          <tbody id="cartBody"></tbody>

        </table>

      </div>
    </div>

    <!-- SUMMARY -->
    <div class="col-lg-4">
      <div class="summary-card p-3">

        <h5>Order Summary</h5>
        <hr>

        <div class="d-flex justify-content-between">
          <span>Subtotal</span>
          <b id="subtotal">₹0</b>
        </div>

        <div class="d-flex justify-content-between mt-2">
          <span>Total</span>
          <b id="total">₹0</b>
        </div>

      </div>

      <button id="checkoutBtn" class="mt-3 rounded-3 w-100 btn btn-warning fw-bold">Procced To Checkout</button>
      
    </div>


  </div>
</div>

{% endblock content %}
